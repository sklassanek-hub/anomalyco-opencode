version: 2
project_name: opencode
before:
  hooks:
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/opencode-ai/opencode/internal/version.Version={{.Version}}
    main: ./main.go

archives:
  - format: tar.gz
    name_template: >-
      opencode-
      {{- if eq .Os "darwin" }}mac-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "#86" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: "checksums.txt"

signs:
  - artifacts: all
    cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
      - SIGSTORE_NO_CACHE=1
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"

sbom:
  artifacts: archive
  document: sbom.spdx.json
  format: spdx-json
  cmd: syft
  args:
    - "${artifact}"
    - "-o"
    - "spdx-json=${document}"
snapshot:
  name_template: "0.0.0-{{ .Timestamp }}"
# Disabled for fork — only relevant to upstream opencode-ai/opencode
# aurs / brews / nfpms / changelog require upstream repo context
changelog:
  disable: true
