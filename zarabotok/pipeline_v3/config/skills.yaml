# Глобальные настройки scoring (ТЗ §7.2)
scoring:
  weights:
    sim: 0.40
    budget: 0.20
    freshness: 0.15
    channel: 0.15
    source: 0.10
  thresholds:
    matched: 65      # S >= 65 → matched
    manual_review: 45  # 45 <= S < 65 → manual_review
    # S < 45 → rejected
  freshness_tau_hours: 3   # exp(-delta_t/3h)
  laplace_alpha: 1   # Laplace((replied+1)/(sent+5))
  risk_penalties:
    scam: 100
    prepayment_request: 30
    adult: 100
    gambling: 100
    diploma: 100
    bypass_protection: 100
    nda_required: 50
    paid_test: 50
    no_contact: 40
    below_min_budget: 50

# Stop-words и фильтры (ТЗ §7.3 hard filters)
filters:
  stop_themes:
    - "только для совершеннолетних"
    - "18+"
    - "казино"
    - "ставки на спорт"
    - "обход блокировки"
    - "взлом"
    - "курсовая за студента"
    - "диссертация"
  stop_paid_test:
    - "оплатите тестовое"
    - "тестовое задание платное"
  prepayment_indicators:
    - "100% предоплата от исполнителя"
    - "залог"
    - "переведите на карту"

# Скоринговые настройки привязки каналов (ТЗ §9.1)
delivery:
  channel_priority:
    - platform_form
    - tg_comment
    - tg_dm
    - email
    - manual_required
  limits:
    global:
      max_per_hour: 8
      max_per_day: 40
      quiet_hours: ["23:00", "08:00"]
    telegram:
      dm_max_per_day: 12
      dm_max_per_hour: 5
      min_delay_s: 45
      max_delay_s: 210
      warmup_days: 7
      warmup_curve: [3, 4, 5, 6, 8, 10, 12]
      on_flood_wait: "pause_channel + honor retry_after * 1.5"
      on_peer_flood: "stop_dm_24h + alert_operator"
      on_spam_block: "STOP ALL + critical alert"
      unique_text_required: true
    email:
      smtp_domain_must_have: [SPF, DKIM, DMARC]
      max_per_day: 25
      require_explicit_contact_in_order: true
  novelty_threshold: 0.25
  autopay_enabled_skills: []  # L4 skills eligible for autopay

# Автопилот (ТЗ §9.3)
autopilot:
  enabled: false
  enabled_skills: []  # skill IDs eligible for autopilot
  require_score_min: 80
  require_qa_passed: true
  require_novelty_min: 0.35
  allowed_channels: [tg_comment, platform_form]
  max_per_day: 5

# Kill switch (ТЗ §17.4)
kill_switch:
  flag_file: "var/run/freeagent.stop"
  resume_confirm_required: true
  pause_queues:
    - delivery
    - outbound
    - execution
  keep_data_on_stop: true
