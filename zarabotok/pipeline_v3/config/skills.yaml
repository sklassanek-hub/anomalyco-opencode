      - "tg бот"
      - "aiogram"
      - "бот для канала"
    negative:
      - "накрутка"
      - "спам-рассылка"
      - "парсер личных данных"
      - "казино"
      - "ставки"
    embedding_anchors:
      - "Нужен бот для приёма заявок с кнопками и выгрузкой в Google Sheets"
      - "Требуется telegram-бот с оплатой и админкой"
