      - "ml"
      - "обучение модели"
      - "django"
      - "flask"
    embedding_anchors:
      - "REST API на FastAPI с авторизацией по JWT и PostgreSQL"
      - "Требуется backend для мобильного приложения с 10 эндпоинтами"
      - "FastAPI + SQLAlchemy + Alembic миграции + Docker"
      - "Нужен микросервис для обработки платежей через ЮKassa"
      - "Backend на Python: REST + WebSocket для чата"
    budget:
      min: 15000
      max: 150000
      currency: RUB
    eta_days:
      min: 3
      max: 14
    capability_confidence: 0.88
    autonomy: L3
    executor: pipeline_python_project
    deliverables:
      - "исходники проекта"
      - "Dockerfile + docker-compose.yml"
      - "README.md с инструкцией запуска"
      - "OpenAPI schema"
      - "pytest тесты"
    requires_human_review: false
    validators:
      - ruff
      - mypy
      - pytest
      - openapi_validate

  - id: tg_bot_aiogram
    title: "Telegram-бот на aiogram 3"
    description: "Бот на aiogram 3 (Python 3.12) с FSM, инлайн-кнопками, интеграциями"
    keywords:
      - "телеграм бот"
