# skills.yaml — реестр навыков по ТЗ §5.1 / §7.1
# Обязательные поля ТЗ: id, title, keywords, negative, embedding_anchors (5-10),
# budget (min/max/currency), eta_days (min/max), capability_confidence,
# executor, deliverables, requires_human_review
# Уровни автономности (ТЗ §5.2): L0 (не умеет) ... L4 (полный автопилот)
# Для автоотклика: L3/L4 (с reviewer-агентом)
# L2 — только после mode=pre_review (ТЗ §5.2)

skills:
  - id: python_script
    title: "Python-скрипт"
    description: "Одноразовые скрипты, утилиты, обработка данных, конвертация форматов, парсинг CSV/JSON/YAML"
    keywords:
      - "python script"
      - "python утилита"
      - "напиши скрипт"
      - "обработка данных"
      - "конвертация"
      - "csv в json"
      - "парсер"
    negative:
      - "веб-приложение"
      - "django"
      - "fastapi"
      - "ml модель"
      - "обучение"
    embedding_anchors:
      - "Нужен python-скрипт для конвертации CSV в JSON с валидацией"
      - "Напишите утилиту для пакетной обработки изображений"
      - "Скрипт для выгрузки данных из API в Excel"
      - "Python-парсер HTML таблиц в CSV"
      - "Требуется CLI-инструмент для очистки логов"
    budget:
      min: 2000
      max: 25000
      currency: RUB
    eta_days:
      min: 1
      max: 3
    capability_confidence: 0.92
    autonomy: L4
    executor: pipeline_python_script
    deliverables:
      - "исходник .py"
      - "README.md"
      - "requirements.txt"
      - "пример запуска"
    requires_human_review: false
    validators:
      - ruff
      - mypy
      - pytest

