# sources.yaml — per-source configuration per ТЗ §4.2 / §6.1
# Обязательные поля: name, chat_id, link, language, theme, trust, allowed_categories,
# contact_extraction, can_dm_author, min_budget, stop_words, poll_interval,
# last_processed_message_date, modes (posts/comments/chat_messages),
# can_read_auto, can_submit_auto, submit_channel, parser_profile (selectors/regex),
# filters (require_any/exclude_any), capabilities

global:
  default_poll_interval_s: 300
  default_lang: ru
  raw_items_retention_days: 90
  embedding_dim: 1024
  dedup:
    fingerprint_algo: sha256
    cosine_threshold: 0.93
    merge_field: also_seen_in
  drift_detection:
    enabled: true
    alert_on_zero: true
  rate_limit:
    global_per_min: 30
    per_source_per_min: 5
    circuit_breaker:
      max_consecutive_errors: 5
      pause_duration_s: 1800
  retry:
    max_attempts: 3
    backoff_base_s: 2
    backoff_jitter_s: 1
    honor_retry_after: true

# Tier 1: основные, авто-чтение
sources:

