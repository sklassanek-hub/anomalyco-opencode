    name: "Freelance: общая работа"
    uri: "@frilans"
    chat_id: null
    link: "https://t.me/frilans"
    language: ru
    theme: freelance_general
    trust: 0.7
    allowed_categories: [dev, design, text, marketing, automation]
    contact_extraction: "regex_telegram"
    can_dm_author: true
    can_read_auto: true
    can_submit_auto: false  # комментарии открыты
    submit_channel: tg_comment
    min_budget: 1500
    currency: RUB
    stop_words: ["ищу работу", "резюме", "портфолио исполнителя", "накрутка", "спам"]
    poll_interval_s: 60
    last_processed_message_date: null
    modes: [posts, comments]
    parser_profile:
      strip_footer_regex: "(?s)Реклама.*$|Наш чат:.*$"
      min_len: 80
      contact_hints: ["@", "t.me/", "писать в лс"]
    filters:
      require_any: ["нужен", "ищу", "требуется", "разработать", "сделать", "бюджет", "оплата", "ТЗ"]
      exclude_any: ["ищу работу", "резюме", "вакансия", "на постоянку"]
    capabilities:
      can_read_auto: true
      can_submit_auto: false
      read_status: official_api
