    language: en
    theme: freelance_global
    trust: 0.9
    can_read_auto: true
    can_submit_auto: true  # реальный авто-отклик
    submit_channel: platform_form
    min_budget: 30
    currency: USD
    poll_interval_s: 300
    requires_oauth: true
    capabilities:
      can_read_auto: true
      can_submit_auto: true
      read_status: official_api
      submit_status: official_api

  - kind: upwork_api
    name: "Upwork GraphQL"
    uri: "https://api.upwork.com/graphql"
    language: en
    theme: freelance_global
    trust: 0.9
    can_read_auto: true
    can_submit_auto: true
    submit_channel: platform_form
    min_budget: 50
    currency: USD
    poll_interval_s: 300
    requires_application_approval: true
    requires_connects_budget: true
    capabilities:
      can_read_auto: true
      can_submit_auto: true
      read_status: official_api
      submit_status: official_api

# Исключены (ТЗ §4.1)
sources_excluded:
  - {kind: html, name: profi.ru, reason: "paid access + manual verification + offline calls"}
  - {kind: html, name: youdo.ru, reason: "paid access + manual moderation"}
  - {kind: html, name: avito_uslugi, reason: "paid + offline"}
  - {kind: html, name: workzilla, reason: "antibot + paid responses + microbudgets"}
  - {kind: html, name: fiverr, reason: "buyer searches gigs, no project responses"}
  - {kind: html, name: toptal, reason: "manual screening"}
  - {kind: html, name: vk_groups, reason: "unstable parsing + low quality"}
  - {kind: html, name: instagram_groups, reason: "unstable + low quality"}

# Глобальные стоп-листы (ТЗ §7.3)
global_filters:
  stop_themes: [adult, gambling, bypass_protection, hack, diploma_work, financial_schemes]
  prepayment_only_threshold_rub: 50000
  paid_test_patterns:
    - "оплатите тестовое"
    - "тестовое задание за \\d+ руб"
  scam_markers: [western_union, moneygram, onlyfans, casino, betting, nude, 18+]
